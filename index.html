<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!--asc:head-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/anek-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      // Runs before first paint: enables JS-only styles and decides whether the countdown plays.
      (function () {
        var d = document.documentElement
        d.classList.add('js')
        try { if (sessionStorage.getItem('asc-visited')) d.classList.add('is-repeat') } catch (e) {}
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('is-reduced')
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!--asc:body-->
  </body>
</html>
